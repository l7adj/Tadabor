<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدبّر — البحث والقراءة</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#faf9f6;color:#292524;margin:0}main{max-width:900px;margin:auto;padding:18px 12px 40px}h1{text-align:center;margin:0 0 12px}.search{width:100%;padding:12px 14px;font-size:19px;border:1px solid #d6d3d1;border-radius:10px;background:#fff;outline:none}.meta{font-size:13px;color:#78716c;margin:10px 2px}.result{background:#fff;border:1px solid #e7e5e4;border-radius:10px;padding:10px 13px;margin:6px 0;cursor:pointer}.ayah{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:22px;line-height:1.8}.ref{font-size:12px;color:#78716c;margin-top:5px}.mark{background:#fde68a;border-radius:3px;padding:0 2px}.empty{text-align:center;color:#78716c;padding:22px}.error{padding:12px;background:#fff7ed;color:#9a3412;border-radius:10px}.reader{display:none}.reader.active{display:block}.searchView.hidden{display:none}.readerHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}.readerHead h2{font-size:18px;margin:0}.readerActions{display:flex;gap:6px}.readerActions button,.ayahActions button{font:inherit;border:1px solid #d6d3d1;background:#fff;border-radius:8px;padding:7px 10px}.surahIntro{text-align:center;margin:8px 0 14px;color:#57534e}.readerAyah{background:#fff;border:1px solid transparent;border-radius:10px;padding:10px 13px;margin:5px 0;scroll-margin-top:12px}.readerAyah.selected{background:#fff9db;border-color:#eab308;box-shadow:0 0 0 1px #fde68a}.readerAyah .ref{display:flex;justify-content:space-between;align-items:center;gap:8px}.ayahActions{display:flex;gap:5px;margin-top:6px}.readerNav{display:flex;gap:7px;margin:10px 0}.readerNav button{flex:1}.back{font-weight:600}.loading{text-align:center;padding:25px;color:#78716c}@media(max-width:600px){main{padding:14px 9px 30px}.ayah{font-size:21px}.readerAyah{padding:9px 11px}}
</style>
</head>
<body><main>
<section id="searchView" class="searchView"><h1>تدبّر</h1><input id="q" class="search" autocomplete="off" inputmode="text" placeholder="اكتب ما تبحث عنه…"><div id="meta" class="meta"></div><div id="results"><div class="loading">جاري تحميل نص القرآن…</div></div></section>
<section id="reader" class="reader"><div class="readerHead"><button id="back" class="back">← العودة إلى البحث</button><h2 id="readerTitle"></h2><span></span></div><div class="readerActions"><button id="copySelected">نسخ الآية المحددة</button></div><div id="readerContent"></div></section>
<script>
const U='https://raw.githubusercontent.com/dotquran/corpus/main/processed/uthmani/quran-uthmani.json';const S='https://raw.githubusercontent.com/dotquran/corpus/main/processed/simple-clean/quran-simple-clean.json';
function norm(s){return(s||'').normalize('NFC').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/gu,'').replace(/[أإآٱ]/g,'ا').replace(/\s+/g,' ').trim()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let corpus=[],selected=-1,searchQuery='',savedScroll=0;
function makeCorpus(u,s){const out=[];u.surahs.forEach((su,si)=>{const sa=s.surahs[si]?.ayahs||[];su.ayahs.forEach((a,j)=>out.push({global:out.length,surah:su.number,name:su.name,ayah:a.number,uthmani:a.text,simple:sa[j]?.text||a.text,words:(sa[j]?.text||a.text).split(/\s+/)}))});return out}
function markText(text,q){if(!q)return esc(text);const nq=norm(q);return text.split(/(\s+)/).map(t=>/^\s+$/.test(t)?t:(norm(t).includes(nq)?'<mark class="mark">'+esc(t)+'</mark>':esc(t))).join('')}
function search(raw){const q=norm(raw);if(!q)return[];return corpus.filter(a=>a.words.some(w=>norm(w).includes(q))||norm(a.simple).includes(q)).sort((a,b)=>a.global-b.global)}
function copy(index){const a=corpus[index];if(!a)return;const text=`${a.uthmani}\nسورة ${a.name} — الآية ${a.ayah}`;navigator.clipboard?.writeText(text)}
function renderResults(){const r=search(searchQuery);meta.textContent=searchQuery?`${r.length} آية مطابقة`:`جاهز — ${corpus.length} آية`;if(!searchQuery){results.innerHTML='<div class="empty">اكتب كلمة أو عبارة للبحث.</div>';return}if(!r.length){results.innerHTML='<div class="empty">لا توجد مطابقة.</div>';return}results.innerHTML=r.slice(0,100).map(a=>`<article class="result" data-open="${a.global}"><div class="ayah">${markText(a.uthmani,searchQuery)}</div><div class="ref">سورة ${a.surah} (${esc(a.name)}) — الآية ${a.ayah}</div></article>`).join('');results.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openReader(+el.dataset.open))}
function openReader(index){selected=index;searchQuery=input.value;savedScroll=scrollY;searchView.classList.add('hidden');reader.classList.add('active');const a=corpus[index];readerTitle.textContent=`سورة ${a.name}`;const start=corpus.findIndex(x=>x.surah===a.surah),end=corpus.findLastIndex?corpus.findLastIndex(x=>x.surah===a.surah):corpus.map(x=>x.surah).lastIndexOf(a.surah);readerContent.innerHTML=`<div class="surahIntro">سورة ${esc(a.name)}</div>`+corpus.slice(start,end+1).map(x=>`<article id="ayah-${x.global}" class="readerAyah ${x.global===index?'selected':''}"><div class="ayah">${esc(x.uthmani)}</div><div class="ref"><span>الآية ${x.ayah}</span><div class="ayahActions"><button data-copy="${x.global}">نسخ</button></div></div></article>`).join('');readerContent.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();copy(+b.dataset.copy);b.textContent='تم النسخ';setTimeout(()=>b.textContent='نسخ',1000)});requestAnimationFrame(()=>document.getElementById(`ayah-${index}`)?.scrollIntoView({behavior:'instant',block:'center'}))}
function closeReader(){reader.classList.remove('active');searchView.classList.remove('hidden');renderResults();requestAnimationFrame(()=>scrollTo(0,savedScroll))}
const input=document.getElementById('q'),results=document.getElementById('results'),meta=document.getElementById('meta'),searchView=document.getElementById('searchView'),reader=document.getElementById('reader'),readerTitle=document.getElementById('readerTitle'),readerContent=document.getElementById('readerContent');
input.oninput=()=>{searchQuery=input.value;renderResults()};document.getElementById('back').onclick=closeReader;document.getElementById('copySelected').onclick=()=>{copy(selected);document.getElementById('copySelected').textContent='تم النسخ';setTimeout(()=>document.getElementById('copySelected').textContent='نسخ الآية المحددة',1000)};
Promise.all([fetch(U).then(r=>r.json()),fetch(S).then(r=>r.json())]).then(([u,s])=>{corpus=makeCorpus(u,s);meta.textContent=`جاهز — ${corpus.length} آية`;results.innerHTML='<div class="empty">اكتب كلمة أو عبارة للبحث.</div>'}).catch(e=>{results.innerHTML='<div class="error">تعذر تحميل نص القرآن.</div>';console.error(e)});
</script></main></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تدبّر</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#29251f;font-family:system-ui,sans-serif}main{max-width:920px;margin:auto;padding:16px 10px 45px}button,input{font:inherit}.searchView h1{text-align:center;margin:5px 0 14px}.search{width:100%;padding:12px 14px;border:1px solid #d6d0c5;border-radius:10px;background:#fff;font-size:18px;outline:none}.meta{font-size:13px;color:#77716a;margin:9px 2px}.result{background:#fff;border:1px solid #e4ded3;border-radius:10px;padding:11px 14px;margin:6px 0;cursor:pointer}.result:hover{background:#fffdf8}.ayah{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:22px;line-height:1.9}.ref{font-size:12px;color:#78716c;margin-top:5px}.mark{background:#f4d35e;border-radius:3px;padding:0 2px}.empty,.loading{text-align:center;color:#78716c;padding:25px}.error{padding:12px;background:#fff7ed;color:#9a3412;border-radius:10px}.reader{display:none}.reader.active{display:block}.searchView.hidden{display:none}.readerTop{position:sticky;top:0;z-index:5;background:#f5f0e6d9;backdrop-filter:blur(5px);padding:6px 0 10px}.readerBar{display:flex;align-items:center;justify-content:space-between;gap:8px}.readerBar button,.ayahMenu button{border:1px solid #cfc8bc;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.readerTitle{font-size:19px;font-weight:700}.mushaf{background:#fffdf8;border:1px solid #ded6c8;border-radius:4px;padding:20px 18px 30px;box-shadow:0 1px 4px #00000010}.surahName{text-align:center;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:27px;font-weight:700;margin:4px 0 20px}.basmala{text-align:center;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:23px;margin-bottom:18px}.surahText{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:25px;line-height:2.15;text-align:justify;direction:rtl}.ayahInline{display:inline;border-radius:5px;padding:2px 3px;scroll-margin-top:70px;cursor:pointer;transition:background .15s}.ayahInline:hover{background:#f7f0d6}.ayahInline.selected{background:#fff0a8;box-shadow:inset 0 0 0 1px #e0bd43}.ayahNum{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border:1px solid #b9a98d;border-radius:50%;font-family:system-ui,sans-serif;font-size:12px;vertical-align:middle;margin:0 5px;color:#6b5b43}.ayahMenu{display:none;position:fixed;z-index:20;background:#fff;border:1px solid #d8d0c4;border-radius:10px;padding:6px;box-shadow:0 5px 20px #0002}.ayahMenu.show{display:block}.readerNav{display:flex;gap:8px;margin:10px 0}.readerNav button{flex:1;border:1px solid #d2c9bb;background:#fff;border-radius:8px;padding:9px}.readerHint{text-align:center;color:#81796f;font-size:12px;margin:9px 0}.loading{padding:30px}@media(max-width:600px){main{padding:10px 6px}.mushaf{padding:15px 10px 25px}.surahText{font-size:22px;line-height:2.05}.ayahNum{width:26px;height:26px;font-size:11px}}</style></head><body><main><section id="searchView" class="searchView"><h1>تدبّر</h1><input id="q" class="search" autocomplete="off" placeholder="اكتب ما تبحث عنه…"><div id="meta" class="meta"></div><div id="results"><div class="loading">جاري تحميل القرآن…</div></div></section><section id="reader" class="reader"><div class="readerTop"><div class="readerBar"><button id="back">← البحث</button><div id="readerTitle" class="readerTitle"></div><button id="copySelected">نسخ المحددة</button></div></div><div class="readerNav"><button id="prevSurah">السورة السابقة</button><button id="nextSurah">السورة التالية</button></div><div id="readerContent"></div><div class="readerHint">اضغط على أي آية لتحديدها ونسخها</div></section><div id="ayahMenu" class="ayahMenu"><button id="menuCopy">نسخ الآية</button></div><script>
const U='https://raw.githubusercontent.com/dotquran/corpus/main/processed/uthmani/quran-uthmani.json',S='https://raw.githubusercontent.com/dotquran/corpus/main/processed/simple-clean/quran-simple-clean.json';const norm=s=>(s||'').normalize('NFC').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/gu,'').replace(/[أإآٱ]/g,'ا').replace(/\s+/g,' ').trim();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let corpus=[],surahs=[],selected=-1,readerSurah=0,searchQuery='',savedScroll=0;function make(u,s){const out=[];u.surahs.forEach((su,si)=>{const a=[];const sa=s.surahs[si]?.ayahs||[];su.ayahs.forEach((x,j)=>{const z={global:out.length,surah:su.number,name:su.name,ayah:x.number,uthmani:x.text,simple:sa[j]?.text||x.text};out.push(z);a.push(z)});surahs.push({number:su.number,name:su.name,ayahs:a})});return out}function highlight(t,q){const nq=norm(q);if(!nq)return esc(t);return t.split(/(\s+)/).map(x=>/^\s+$/.test(x)?x:norm(x).includes(nq)?'<mark class="mark">'+esc(x)+'</mark>':esc(x)).join('')}function search(q){const n=norm(q);if(!n)return[];const terms=n.split(' ').filter(Boolean);return corpus.filter(a=>{const text=norm(a.simple)+' '+norm(a.uthmani);return text.includes(n)||terms.every(t=>text.includes(t))||a.simple.split(/\s+/).some(w=>norm(w).includes(n))}).sort((a,b)=>a.global-b.global)}async function copy(i){const a=corpus[i];if(!a)return;const text=`${a.uthmani}\nسورة ${a.name} — الآية ${a.ayah}`;try{await navigator.clipboard.writeText(text)}catch{const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}}function results(){const r=search(searchQuery);meta.textContent=searchQuery?`${r.length} آية مطابقة`:`جاهز — ${corpus.length} آية`;if(!searchQuery){resultsEl.innerHTML='<div class="empty">اكتب كلمة أو عبارة للبحث.</div>';return}if(!r.length){resultsEl.innerHTML='<div class="empty">لا توجد مطابقة.</div>';return}resultsEl.innerHTML=r.slice(0,100).map(a=>`<article class="result" data-open="${a.global}"><div class="ayah">${highlight(a.uthmani,searchQuery)}</div><div class="ref">سورة ${a.surah} (${esc(a.name)}) — الآية ${a.ayah}</div></article>`).join('');resultsEl.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openReader(+x.dataset.open))}function renderMushaf(si,focus){readerSurah=si;const s=surahs[si];readerTitle.textContent=`${s.number}. ${s.name}`;let html='<div class="mushaf"><div class="surahName">سورة '+esc(s.name)+'</div>'+(s.number!==9?'<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>':'')+'<div class="surahText">';s.ayahs.forEach(a=>{html+=`<span id="ayah-${a.global}" class="ayahInline ${a.global===focus?'selected':''}" data-ayah="${a.global}">${esc(a.uthmani)} <span class="ayahNum">${a.ayah}</span></span> `});html+='</div></div>';readerContent.innerHTML=html;readerContent.querySelectorAll('[data-ayah]').forEach(x=>x.onclick=e=>selectAyah(+x.dataset.ayah,e));if(focus>=0)requestAnimationFrame(()=>document.getElementById('ayah-'+focus)?.scrollIntoView({behavior:'smooth',block:'center'}))}function openReader(i){selected=i;searchQuery=input.value;savedScroll=scrollY;readerSurah=surahs.findIndex(s=>s.number===corpus[i].surah);searchView.classList.add('hidden');reader.classList.add('active');renderMushaf(readerSurah,i)}function selectAyah(i,e){selected=i;readerContent.querySelectorAll('.ayahInline.selected').forEach(x=>x.classList.remove('selected'));document.getElementById('ayah-'+i)?.classList.add('selected');menu.style.left=(e.clientX||20)+'px';menu.style.top=(e.clientY||80)+'px';menu.classList.add('show')}function closeReader(){menu.classList.remove('show');reader.classList.remove('active');searchView.classList.remove('hidden');results();requestAnimationFrame(()=>scrollTo(0,savedScroll))}const input=document.getElementById('q'),resultsEl=document.getElementById('results'),meta=document.getElementById('meta'),searchView=document.getElementById('searchView'),reader=document.getElementById('reader'),readerTitle=document.getElementById('readerTitle'),readerContent=document.getElementById('readerContent'),menu=document.getElementById('ayahMenu');input.oninput=()=>{searchQuery=input.value;results()};document.getElementById('back').onclick=closeReader;document.getElementById('copySelected').onclick=()=>copy(selected);document.getElementById('menuCopy').onclick=()=>{copy(selected);menu.classList.remove('show')};document.addEventListener('click',e=>{if(!e.target.closest('.ayahMenu')&&!e.target.closest('.ayahInline'))menu.classList.remove('show')});document.getElementById('prevSurah').onclick=()=>{if(readerSurah>0)renderMushaf(readerSurah-1,-1)};document.getElementById('nextSurah').onclick=()=>{if(readerSurah<surahs.length-1)renderMushaf(readerSurah+1,-1)};Promise.all([fetch(U).then(r=>{if(!r.ok)throw Error('quran');return r.json()}),fetch(S).then(r=>{if(!r.ok)throw Error('simple');return r.json()})]).then(([u,s])=>{make(u,s);meta.textContent=`جاهز — ${corpus.length} آية`;results()}).catch(e=>{resultsEl.innerHTML='<div class="error">تعذر تحميل القرآن.</div>';console.error(e)});
</script></main></body></html>

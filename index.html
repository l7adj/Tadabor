<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدبّر — محرك البحث</title>
<style>
body{font-family:system-ui,sans-serif;background:#faf9f6;color:#292524;margin:0}main{max-width:900px;margin:auto;padding:24px 14px}h1{text-align:center}.search{width:100%;box-sizing:border-box;padding:14px 16px;font-size:20px;border:1px solid #d6d3d1;border-radius:12px;background:white;outline:none}.meta{font-size:13px;color:#78716c;margin:12px 2px}.result{background:white;border:1px solid #e7e5e4;border-radius:12px;padding:16px;margin:10px 0}.ayah{font-family:"Amiri",serif;font-size:24px;line-height:2.1}.ref{font-size:12px;color:#78716c;margin-top:8px}.mark{background:#dcfce7;border-radius:3px}.error{background:#fff7ed;padding:12px;border-radius:10px;color:#9a3412}.loading{color:#78716c;text-align:center;padding:25px}
</style>
</head>
<body><main>
<h1>تدبّر</h1>
<input id="q" class="search" autocomplete="off" placeholder="اكتب ما تبحث عنه…">
<div id="meta" class="meta"></div><div id="results"><div class="loading">جاري تحميل نص القرآن…</div></div>
<script>
const UTHMANI='https://raw.githubusercontent.com/dotquran/corpus/main/processed/uthmani/quran-uthmani.json';
const SIMPLE='https://raw.githubusercontent.com/dotquran/corpus/main/processed/simple-clean/quran-simple-clean.json';
const ALIF={'أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ا':'ا'};
const IGN=/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/u;
function norm(s){s=(s||'').normalize('NFC');let o='';for(const c of s){if(IGN.test(c))continue;o+=ALIF[c]??c}return o.replace(/\s+/g,' ').trim()}
let corpus=[];
function flatten(x){if(Array.isArray(x))return x; if(x?.surahs)return x.surahs; return []}
function makeCorpus(u,s){const out=[];const us=flatten(u),ss=flatten(s);for(let i=0;i<us.length;i++){const su=us[i],ssu=ss[i];const ua=su.ayahs||[],sa=ssu?.ayahs||[];for(let j=0;j<ua.length;j++){const a=ua[j],b=sa[j];out.push({surah:su.number,ayah:a.number,text:a.text,search:b?.text?norm(b.text):norm(a.text)})}}return out}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlight(text,q){const nq=norm(q);if(!nq)return esc(text);let plain='',map=[];for(let i=0;i<text.length;i++){const c=text[i];if(IGN.test(c))continue;plain+=ALIF[c]??c;map.push(i)}let at=plain.indexOf(nq);if(at<0)return esc(text);const a=map[at],z=map[at+nq.length-1]+1;return esc(text.slice(0,a))+'<span class="mark">'+esc(text.slice(a,z))+'</span>'+esc(text.slice(z))}
function search(q){const nq=norm(q);if(!nq)return[];const r=[];for(const a of corpus){let p=0,c=0;while((p=a.search.indexOf(nq,p))!==-1){c++;p+=Math.max(1,nq.length)}if(c)r.push({...a,count:c})}return r}
const q=document.getElementById('q'),results=document.getElementById('results'),meta=document.getElementById('meta');
q.addEventListener('input',()=>{const raw=q.value;const r=search(raw);meta.textContent=raw.trim()?`${r.length} آية مطابقة`:'';results.innerHTML=r.slice(0,100).map(a=>`<article class="result"><div class="ayah">${highlight(a.text,raw)}</div><div class="ref">سورة ${a.surah} — الآية ${a.ayah}</div></article>`).join('')|| (raw.trim()?'لا توجد مطابقة.':'')});
Promise.all([fetch(UTHMANI).then(r=>r.json()),fetch(SIMPLE).then(r=>r.json())]).then(([u,s])=>{corpus=makeCorpus(u,s);results.innerHTML='';meta.textContent='جاهز — 6236 آية'}).catch(e=>{results.innerHTML='<div class="error">تعذر تحميل نص القرآن. افتح الصفحة مع اتصال بالإنترنت.</div>';console.error(e)});
</script></main></body></html>

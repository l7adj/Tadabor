<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدبّر — محرك البحث</title>
<style>
body{font-family:system-ui,sans-serif;background:#faf9f6;color:#292524;margin:0}main{max-width:900px;margin:auto;padding:24px 14px}
h1{text-align:center;margin:0 0 14px}.search{width:100%;box-sizing:border-box;padding:14px 16px;font-size:20px;border:1px solid #d6d3d1;border-radius:12px;background:white;outline:none}
.meta{font-size:13px;color:#78716c;margin:12px 2px}.result{background:white;border:1px solid #e7e5e4;border-radius:12px;padding:16px;margin:10px 0}
.ayah{font-family:"Amiri",serif;font-size:24px;line-height:2.1}.ref{font-size:12px;color:#78716c;margin-top:8px}.mark{background:#dcfce7;border-radius:3px}.error{background:#fff7ed;padding:12px;border-radius:10px;color:#9a3412}.loading{color:#78716c;text-align:center;padding:25px}
</style></head>
<body><main>
<h1>تدبّر</h1>
<input id="q" class="search" autocomplete="off" inputmode="text" placeholder="اكتب ما تبحث عنه…">
<div id="meta" class="meta"></div><div id="results"><div class="loading">جاري تحميل نص القرآن…</div></div>
<script>
const UTHMANI='https://raw.githubusercontent.com/dotquran/corpus/main/processed/uthmani/quran-uthmani.json';
const SIMPLE='https://raw.githubusercontent.com/dotquran/corpus/main/processed/simple-clean/quran-simple-clean.json';
const DIAC=/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/u;
function norm(s){return (s||'').normalize('NFC').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/gu,'').replace(/[أإآٱ]/g,'ا').replace(/\s+/g,' ').trim()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let corpus=[];
function makeCorpus(u,s){const out=[];for(let i=0;i<u.surahs.length;i++){const us=u.surahs[i],ss=s.surahs[i];const sa=ss?.ayahs||[];for(let j=0;j<us.ayahs.length;j++){const ua=us.ayahs[j],simple=sa[j]?.text||ua.text;out.push({surah:us.number,name:us.name,ayah:ua.number,global:out.length+1,uthmani:ua.text,simple,words:simple.split(/\s+/)})}}return out}
function highlightWord(word,q){const n=norm(word),at=n.indexOf(q);if(at<0)return esc(word);let plain='',map=[];for(let i=0;i<word.length;i++){const c=word[i];if(DIAC.test(c))continue;plain+=/[أإآٱ]/.test(c)?'ا':c;map.push(i)}const a=map[at],z=map[at+q.length-1]+1;return esc(word.slice(0,a))+'<span class="mark">'+esc(word.slice(a,z))+'</span>'+esc(word.slice(z))}
function renderAyah(a,q){const nq=norm(q);const uw=a.uthmani.split(/(\s+)/);const sw=a.simple.split(/(\s+)/);return uw.map((token,i)=>{if(/^\s+$/.test(token))return token;const st=sw[i]||'';return norm(st).includes(nq)?highlightWord(token,nq):esc(token)}).join('')}
function search(raw){const q=norm(raw);if(!q)return[];const phrase=q.includes(' ');const hits=[];for(const a of corpus){if(phrase){if(norm(a.simple).includes(q))hits.push({...a,score:100});continue}let score=0;for(const w of a.words){if(norm(w)===q){score=100;break}if(norm(w).includes(q))score=Math.max(score,90)}if(score)hits.push({...a,score})}return hits.sort((a,b)=>b.score-a.score||a.global-b.global)}
const input=document.getElementById('q'),results=document.getElementById('results'),meta=document.getElementById('meta');
input.addEventListener('input',()=>{const raw=input.value,r=search(raw);if(!raw.trim()){meta.textContent='';results.innerHTML='';return}meta.textContent=`${r.length} آية مطابقة`;results.innerHTML=r.slice(0,100).map(a=>`<article class="result"><div class="ayah">${renderAyah(a,raw)}</div><div class="ref">سورة ${a.surah} (${esc(a.name)}) — الآية ${a.ayah}</div></article>`).join('')||'لا توجد مطابقة.'});
Promise.all([fetch(UTHMANI).then(r=>{if(!r.ok)throw Error('uthmani');return r.json()}),fetch(SIMPLE).then(r=>{if(!r.ok)throw Error('simple');return r.json()})]).then(([u,s])=>{corpus=makeCorpus(u,s);meta.textContent=`جاهز — ${corpus.length} آية`}).catch(e=>{results.innerHTML='<div class="error">تعذر تحميل نص القرآن. افتح الصفحة مع اتصال بالإنترنت.</div>';console.error(e)});
</script></main></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تدبّر — المصحف</title><style>body{margin:0;background:#f5f0e6;color:#29251f;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:12px}button,input{font:inherit}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar button,.bar input{padding:8px;border:1px solid #cfc8bc;background:#fff;border-radius:8px}.page{max-width:760px;margin:12px auto;background:#fffdf8;border:1px solid #c9bfae;padding:18px 22px;min-height:72vh}.head,.foot{display:flex;justify-content:space-between;color:#71685d;font-size:12px;border-bottom:1px solid #e7dfd2;padding:8px 0}.foot{border-top:1px solid #e7dfd2;border-bottom:0;margin-top:18px}.text{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:26px;line-height:2.35;text-align:justify;padding:22px 0}.a{padding:2px 3px;border-radius:5px;cursor:pointer}.a.sel{background:#fff0a8;box-shadow:inset 0 0 0 1px #e0bd43}.n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid #b9a98d;border-radius:50%;font-family:system-ui;font-size:11px;vertical-align:middle;margin:0 5px}.status{text-align:center;color:#786f64;padding:15px}@media(max-width:600px){.page{padding:12px 10px}.text{font-size:22px;line-height:2.08}}</style></head><body><main><div class="bar"><button id="prev">السابق</button><span><input id="page" type="number" min="1" max="604" value="1"><button id="go">اذهب</button></span><button id="next">التالي</button><button id="copy">نسخ الآية</button></div><div id="root" class="status">جاري فتح المصحف…</div></main><script type="module">import{MushafReader}from'./src/engine/mushaf.js';const root=document.getElementById('root'),page=document.getElementById('page');let selected=null;const m=new MushafReader({root,onSelect:k=>selected=k});async function render(){await m.render();page.value=m.page}document.getElementById('prev').onclick=async()=>{await m.previous();page.value=m.page};document.getElementById('next').onclick=async()=>{await m.next();page.value=m.page};document.getElementById('go').onclick=async()=>{await m.goTo(page.value);page.value=m.page};document.getElementById('copy').onclick=async()=>{if(selected)await navigator.clipboard?.writeText(selected)};render().catch(()=>root.innerHTML='<div class="status">تعذر تحميل المصحف.</div>');</script></body></html>
